<!DOCTYPE html><html lang="en"><head><title>Teams | CopticSports</title><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1a28">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CopticSports">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="assets/img/icon-512.png">
<link rel="icon" href="assets/img/logo-mini.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;700;800&family=Archivo+Black&display=swap" rel="stylesheet">
<meta name="description" content="Eight teams named for four pairs of brother saints. Records, titles, rosters and history.">
<meta property="og:type" content="website"><meta property="og:site_name" content="TCBL">
<meta property="og:title" content="TCBL Teams"><meta property="og:description" content="Eight teams named for four pairs of brother saints. Records, titles, rosters and history.">
<meta property="og:url" content="https://coptichoops.com/teams"><meta property="og:image" content="https://coptichoops.com/assets/img/og.jpg">
<meta property="og:image:width" content="1200"><meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image"><meta name="twitter:image" content="https://coptichoops.com/assets/img/og.jpg">
<link rel="stylesheet" href="assets/css/style.css?v=20261114"></head><body>
<header id="topbar" class="topbar"></header>
<section class="page-hero" id="thero" style="--hero-pos:center 40%"><div class="hero-bg" style="background-image:url(assets/img/photos/s4-102.jpg)"></div><div class="hero-bg m" style="background-image:url(assets/img/photos/s4-103.jpg);background-position:50% 40%"></div><div class="wrap">
  <div class="kicker">Eight teams, four pairs of brothers</div>
  <h1>The <em>teams</em></h1>
  <p>Every TCBL team is named for a saint, and every saint has a brother in the league: Peter &amp; Andrew, James &amp; John, Basil &amp; Gregory, Maximus &amp; Dometius.</p>
</div></section>
<section class="section"><div class="wrap">
  <div class="sec-head" id="headrow"><h2 id="title">Season 5 teams</h2></div>
  <div id="content"></div>
</div></section>
<script src="assets/js/app.js?v=20261114"></script>
<script>
CS.nav("teams"); CS.footer();
(async()=>{
  const teams = await CS.data("teams"), all = await CS.allTime(), P = await CS.players();
  const params = new URLSearchParams(location.search);
  const pick = params.get("t");
  if(pick && teams[pick]) return detail(pick, teams, all, P);
  const core = Object.keys(teams).filter(t=>teams[t].seasons["5"]);
  const legacy = Object.keys(teams).filter(t=>!teams[t].seasons["5"]);
  const lm = fg => fg.toLowerCase()==="#141414" ? "logo-black.png" : "logo-white.png";
  const card = (t,i) => {
    const c = CS.colors[t]||{bg:"#334",fg:"#fff"}, st = CS.saints[t]||{}, r = all.teams[t]||{w:0,l:0,titles:[],finals:[]};
    const cn = teams[t].seasons["5"] && teams[t].seasons["5"].captain, cp = cn && (P[CS.slug(cn)]||{name:cn});
    const cap = cn ? `<span class="cap-line">${CS.avatar({...cp, team:t})}<span>Captain <b>${cn}</b></span></span>`
      : teams[t].seasons["5"] ? `<span class="bro">Captain to be announced</span>` : "";
    return `<a class="team-card2 reveal d${i%4}" href="teams?t=${encodeURIComponent(t)}">
      <div class="top" style="background:${c.bg};color:${c.fg}"><img src="assets/img/${lm(c.fg)}" alt="">
        <small>${st.full||t}</small><h3>${t}</h3>
        <div class="rec2">${r.w}–${r.l} all-time</div></div>
      <div class="bot">${cap}
        ${r.titles.length?`<div class="banner-row">${CS.badge("champ", r.titles.length>1?`${r.titles.length}× champions`:`Season ${r.titles[0]} champions`)}</div>`:""}</div></a>`;
  };
  document.getElementById("content").innerHTML =
    `<div class="grid4 tgrid">${core.map(card).join("")}</div>
     ${legacy.length?`<div class="sec-head" style="margin-top:44px"><h2>Season 2 clubs</h2></div>
     <div class="grid4 tgrid">${legacy.map(card).join("")}</div>`:""}`;
})();
async function detail(t, teams, all, P){
  const info = teams[t], c = CS.colors[t], st = CS.saints[t]||{}, r = all.teams[t]||{w:0,l:0,titles:[],finals:[],seasons:0};
  document.getElementById("thero").remove();
  document.title = `${t} | CopticSports`;
  document.getElementById("headrow").innerHTML = `<a class="more" style="margin-left:0" href="teams">← All teams</a>`;
  // season-by-season: record, seed and how the year ended
  const rows = all.done.map(n=>{
    const d = all.seasons[all.done.indexOf(n)], s = (d.standings||[]).find(x=>x.team===t);
    if(!s) return "";
    const fg = CS.finalGame(d);
    const end = d.champion===t ? "🏆 Champions" : (d.runnerUp===t ? "Finals" :
      (d.games.some(g=>/Semi/.test(g.stage) && [g.team1,g.team2].includes(t)) ? "Semifinals" :
      (d.games.some(g=>/Playoff/.test(g.stage) && [g.team1,g.team2].includes(t)) ? "Playoffs" : "-")));
    const seed = (d.standings||[]).indexOf(s)+1;
    return `<tr><td>Season ${n}</td><td class="num">${s.w}–${s.l}</td><td>${end}</td></tr>`;
  }).join("");
  // leaders count only what a player did while wearing this team's colours
  const stints = Object.values(P).map(p=>{
    const ss = Object.values(p.seasons).filter(x=>x.team===t && !x.rosterOnly && x.gp);
    if(!ss.length) return null;
    const sum = k => ss.reduce((a,x)=>a+(x[k]||0),0);
    return {p, gp:sum("gp"), pts:sum("pts"), reb:sum("reb"), ast:sum("ast")};
  }).filter(Boolean);
  const lead = (k,l) => { const x = [...stints].sort((a,b)=>b[k]-a[k])[0];
    return x ? `<a href="player?p=${x.p.slug}">${CS.avatar({...x.p, team:t})}<i>${l}</i><b>${x.p.name}</b><em data-count="${x[k]}">0</em></a>` : ""; };
  // rosters: one season at a time
  const sns = Object.keys(info.seasons).sort((a,b)=>b-a);
  const roster = sn=>{
    const d = info.seasons[sn];
    const list = (d.roster||[]).slice().sort((a,b)=> (b.name===d.captain)-(a.name===d.captain) || a.name.localeCompare(b.name));
    return `<div class="rgrid">${list.map(r=>{ const p = P[CS.slug(r.name)] || {name:r.name, slug:CS.slug(r.name)};
        return `<a class="rp" href="player?p=${p.slug}">${CS.avatar({...p, team:t})}<div><b>${r.name}</b><span>${r.num!=null?"#"+r.num:""}</span></div>
          ${d.captain===r.name?CS.badge("cap"):""}</a>`; }).join("")}</div>
      ${d.note && list.length<=1 ? `<p class="note" style="margin-top:14px">${d.note}</p>` : ""}`;
  };
  const lm = c.fg.toLowerCase()==="#141414" ? "logo-black.png" : "logo-white.png";
  document.getElementById("content").innerHTML = `
    <div class="team-hero reveal" style="background:${c.bg};color:${c.fg};${c.bg.toLowerCase()==="#ffffff"?"border:1px solid #ddd;":""}">
      <img class="wm" src="assets/img/${lm}" alt="">
      <small>${st.full||t}${st.brother?`, brother of ${st.brother}`:""}</small>
      <h2>${t}</h2><p>${st.bio||""}</p>
      <div class="tstats"><div><b>${r.w}–${r.l}</b><span>Record</span></div>
        <div><b>${r.titles.length}</b><span>Titles</span></div><div><b>${r.finals.length}</b><span>Finals</span></div></div>
      ${r.titles.length?`<div class="banner-row" style="margin-top:16px">${r.titles.map(s=>CS.badge("champ",`Season ${s} champions`)).join("")}</div>`:""}
    </div>
    <div class="grid3 tdetail" style="grid-template-columns:1fr 1.2fr;margin-bottom:26px">
      <div class="card reveal"><h3>Season by season</h3><table class="tbl"><thead><tr><th>Season</th><th class="num">Record</th><th>Finish</th></tr></thead><tbody>${rows}</tbody></table></div>
      ${stints.length?`<div class="card reveal"><h3>Best in ${t} colors</h3><div class="lead3">${lead("pts","Points")}${lead("reb","Rebounds")}${lead("ast","Assists")}</div></div>`:""}
    </div>
    <div class="sec-head"><h2>Roster</h2></div>
    <div class="seg" id="seg">${sns.map((n,i)=>`<button type="button" data-k="${n}" class="${i?"":"on"}">Season ${n}</button>`).join("")}</div>
    <div id="roster">${roster(sns[0])}</div>`;
  const seg = document.getElementById("seg");
  seg.onclick = e=>{ const b = e.target.closest("button"); if(!b || b.classList.contains("on")) return;
    seg.querySelectorAll("button").forEach(x=>x.classList.toggle("on", x===b));
    const r = document.getElementById("roster"); r.innerHTML = roster(b.dataset.k); r.classList.remove("swap"); void r.offsetWidth; r.classList.add("swap"); };
}
</script></body></html>
