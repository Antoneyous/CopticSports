<!DOCTYPE html><html lang="en"><head><title>Coptic Calendar | CopticSports</title><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="assets/img/icon-512.png">

<meta property="og:title" content="Calendar · TCBL"><meta property="og:description" content="TCBL games alongside the Coptic Orthodox calendar of feasts and fasts.">
<meta property="og:url" content="https://coptichoops.com/calendar.html"><meta property="og:image" content="https://coptichoops.com/assets/img/og.jpg">

<link rel="stylesheet" href="assets/css/style.css"></head><body>
<header id="topbar" class="topbar"></header>
<section class="section"><div class="wrap">
  <div class="sec-head"><h2>Season & Coptic Calendar</h2></div>
  <p style="color:var(--ink-dim);max-width:820px;margin-bottom:10px">Every game day alongside the fasts and feasts
  of the Coptic Orthodox Church, so the league always moves with the rhythm of the Church year.</p>
  <p style="color:var(--ink-faint);max-width:820px;margin-bottom:22px;font-size:13px" id="wfnote"></p>
  <div class="cal-head">
    <button id="prev">‹</button><h3 id="mlabel"></h3><button id="next">›</button>
    <span style="color:var(--ink-faint);font-size:12.5px" id="fastnote"></span>
  </div>
  <p class="ag-fastnote" id="ag-fastnote"></p>
  <div class="cal-wrap"><div class="cal" id="cal"></div></div>
  <div class="agenda" id="agenda"></div>
  <div class="legend">
    <span><i style="background:rgba(254,111,15,.5)"></i>TCBL games & league events</span>
    <span><i style="background:rgba(61,220,132,.45)"></i>Coptic feasts</span>
    <span><i style="background:#123049;border:1px solid #1d4463"></i>Fasting day, including every Wednesday &amp; Friday</span>
  </div>
</div></section>
<script src="assets/js/app.js"></script>
<script>
CS.nav("calendar"); CS.footer();
let cur;                       // Date of first of displayed month
const MIN=new Date(2026,8,1), MAX=new Date(2027,4,31);
(async()=>{
  const cal = await CS.data("calendar"), s5 = await CS.data("season5");
  const events = {};             // 'YYYY-MM-DD' -> [{type,label,major}]
  const add=(d,e)=>{(events[d]=events[d]||[]).push(e)};
  cal.feasts.forEach(f=>add(f.date,{type:"feast",label:f.name,major:f.rank==="major"}));
  s5.games.forEach(g=>{
    if(g.status==="BYE") add(g.date,{type:"league",label:"Bye Week"});
    else if(g.team1) add(g.date,{type:"game",teams:[g.team1,g.team2],label:CS.fmtTime(g.time)});
    else add(g.date,{type:"game",label:`${g.stage} · ${g.venue}`});
  });
  s5.milestones.forEach(m=>add(m.date,{type:"league",label:m.label}));
  // ---- fasting days ----
  // 1. the named fast seasons
  const fastDays = new Set(); const fastName = {};
  cal.fasts.forEach(f=>{
    let d=new Date(f.start+"T12:00"), end=new Date(f.end+"T12:00");
    while(d<=end){ const k=d.toISOString().slice(0,10); fastDays.add(k); fastName[k]=f.name; d.setDate(d.getDate()+1); }
  });
  // 2. every Wednesday & Friday year-round, except the fast-free seasons
  //    and any Major Feast of the Lord falling on one of those days
  const freeRanges=(cal.fastFree||[]).map(f=>[new Date(f.start+"T12:00"), new Date(f.end+"T12:00")]);
  const majors=new Set(cal.majorFeastsOfTheLord||[]);
  const wf=(cal.weeklyFast&&cal.weeklyFast.days)||[3,5];
  {
    let d=new Date("2026-09-01T12:00"), end=new Date("2027-05-31T12:00");
    while(d<=end){
      const k=d.toISOString().slice(0,10);
      const isFree=freeRanges.some(([a,b])=>d>=a&&d<=b) || majors.has(k);
      if(wf.includes(d.getDay()) && !isFree && !fastDays.has(k)){
        fastDays.add(k); fastName[k]=cal.weeklyFast?cal.weeklyFast.name:"Wednesday & Friday Fast";
      }
      d.setDate(d.getDate()+1);
    }
  }
  const today=new Date();
  cur = (today>=MIN && today<=MAX) ? new Date(today.getFullYear(),today.getMonth(),1) : new Date(2026,10,1);
  const shortFast=n=> n==="Wednesday & Friday Fast" ? "fast" : n.replace(" Fast","").replace("Great ","")+" fast";
  const draw=()=>{
    document.getElementById("mlabel").textContent = cur.toLocaleDateString("en-US",{month:"long",year:"numeric"});
    const first=new Date(cur), startDow=first.getDay(), dim=new Date(cur.getFullYear(),cur.getMonth()+1,0).getDate();
    let html='["S","M","T","W","T","F","S"]'; html=JSON.parse(html).map(d=>`<div class="dow">${d}</div>`).join("");
    for(let i=0;i<startDow;i++) html+='<div class="day out"></div>';
    let agenda="";                       // mobile day-by-day list
    const DOW=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
    const todayKey=CS.todayET();   // was UTC: flipped to tomorrow at 8 PM
    for(let d=1;d<=dim;d++){
      const key=`${cur.getFullYear()}-${String(cur.getMonth()+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
      const isToday = key===todayKey;
      // grid cells are ~100px wide, so games collapse to one line: time + two codes
      const evs=(events[key]||[]).map(e=> e.teams
        ? `<div class="evt game"><b class="t">${e.label.replace(/\s?[AP]M$/,"")}</b>${CS.teamTag(e.teams[0])}<i>v</i>${CS.teamTag(e.teams[1])}</div>`
        : `<div class="evt ${e.type} ${e.major?"major":""}">${e.label}</div>`).join("");
      // the mobile agenda has room for real names
      const evsAg=(events[key]||[]).map(e=> e.teams
        ? `<div class="evt game ag">${CS.teamShort(e.teams[0],"sm")}<i>v</i>${CS.teamShort(e.teams[1],"sm")}<b class="t">${e.label}</b></div>`
        : `<div class="evt ${e.type} ${e.major?"major":""}">${e.label}</div>`).join("");
      const fasting=fastDays.has(key);
      html+=`<div class="day ${fasting?"fasting":""} ${isToday?"today":""}">
        <span class="dnum">${d}</span> ${fasting?`<span class="fast-tag">${shortFast(fastName[key])}</span>`:""}
        ${evs}</div>`;
      // agenda skips ordinary empty days so the list stays scannable
      if(evs || fasting){
        const dow=new Date(cur.getFullYear(),cur.getMonth(),d).getDay();
        agenda+=`<div class="ag-day ${fasting?"fasting":""} ${evs?"":"quiet"} ${isToday?"today":""}">
          <div class="ag-date"><b>${d}</b><span>${isToday?"Today":DOW[dow]}</span></div>
          <div class="ag-body">
            ${fasting?`<span class="fast-tag">${shortFast(fastName[key])}</span>`:""}
            ${evsAg}</div></div>`;
      }
    }
    document.getElementById("cal").innerHTML=html;
    document.getElementById("agenda").innerHTML = agenda ||
      `<p class="ag-empty">Nothing on the calendar this month.</p>`;
    const monthFasts=cal.fasts.filter(f=>new Date(f.end+"T00:00")>=cur && new Date(f.start+"T00:00")<=new Date(cur.getFullYear(),cur.getMonth()+1,0));
    const fastLine = monthFasts.map(f=>`${f.name}: ${CS.fmtDate(f.start,{month:"short",day:"numeric"})} to ${CS.fmtDate(f.end,{month:"short",day:"numeric"})}`).join("   ·   ");
    document.getElementById("fastnote").textContent = fastLine;
    document.getElementById("ag-fastnote").textContent = fastLine;
    document.getElementById("prev").disabled = cur<=MIN;
    document.getElementById("next").disabled = new Date(cur.getFullYear(),cur.getMonth()+1,1)>MAX;
  };
  document.getElementById("prev").onclick=()=>{cur.setMonth(cur.getMonth()-1);draw()};
  document.getElementById("next").onclick=()=>{cur.setMonth(cur.getMonth()+1);draw()};
  const wn=document.getElementById("wfnote");
  if(wn&&cal.weeklyFast) wn.textContent=cal.weeklyFast.note;
  draw();
})();
</script></body></html>
