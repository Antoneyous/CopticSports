<link rel="stylesheet" href="assets/css/style.css"></head><body>
<header id="topbar" class="topbar"></header>
<section class="section" id="live"><div class="wrap">
  <div class="sec-head"><h2>Watch Live</h2>
    <a class="more" href="https://www.youtube.com/@Coptichoops" target="_blank" rel="noopener">Our YouTube channel →</a></div>
  <div id="livehost"></div>
</div></section>
<section class="section"><div class="wrap">
  <div class="sec-head"><h2>Schedule & Results</h2></div>
  <div class="tabs" id="tabs"></div>
  <div id="weeks"></div>
</div></section>
<script src="assets/js/app.js"></script>
<script>
CS.nav("schedule"); CS.footer();
CS.liveSection(document.getElementById("livehost"));
async function show(n){
  const s = await CS.data("season"+n);
  const byWeek = {};
  s.games.forEach(g=>{ (byWeek[g.stage] = byWeek[g.stage]||{date:g.date, venue:g.venue, games:[]}).games.push(g); });
  document.getElementById("weeks").innerHTML = Object.entries(byWeek).map(([stage,w])=>`
    <div style="margin-bottom:30px">
      <div class="sec-head" style="margin-bottom:12px">
        <h2 style="font-size:18px">${stage}</h2>
        <span style="color:var(--ink-faint);font-size:13px">${CS.fmtDate(w.date)}${w.venue?" · "+w.venue:""}</span>
      </div>
      <div class="score-strip">${w.games.map(g=>CS.gameCard(g)).join("")}</div>
    </div>`).join("") || "<p class='note'>No games recorded for this season yet.</p>";
}
CS.seasonTabs(document.getElementById("tabs"), 5, show); show(5);
</script></body></html>
