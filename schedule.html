<link rel="stylesheet" href="assets/css/style.css?v=20261115e"></head><body>
<header id="topbar" class="topbar"></header>
<section class="page-head"><div class="wrap"><h1>Schedule</h1></div></section>
<section class="section first" id="live" hidden><div class="wrap">
  <div class="sec-head"><h2>Watch live</h2>
    <a class="more" href="https://www.youtube.com/@Coptichoops" target="_blank" rel="noopener">YouTube</a></div>
  <div id="livehost"></div>
</div></section>
<section class="section first"><div class="wrap">
  <div class="tabs" id="tabs"></div>
  <div id="weeks" aria-busy="true"><div class="skel-week"><div class="skel" style="height:22px;width:180px;margin-bottom:14px"></div>
    <div class="score-strip"><div class="skel" style="height:118px"></div><div class="skel" style="height:118px"></div><div class="skel" style="height:118px"></div><div class="skel" style="height:118px"></div></div></div></div>
</div></section>
<script src="assets/js/app.js?v=20261115e"></script>
<script>
CS.nav("schedule"); CS.footer();
CS.liveSection(document.getElementById("livehost"), true);
async function show(n){
  const s = await CS.data("season"+n);
  document.getElementById("weeks").removeAttribute("aria-busy");
  const byWeek = {};
  s.games.forEach(g=>{ (byWeek[g.stage] = byWeek[g.stage]||{date:g.date, venue:g.venue, games:[]}).games.push(g); });
  document.getElementById("weeks").innerHTML = Object.entries(byWeek).map(([stage,w])=>`
    <div class="week">
      <div class="week-head"><h3>${stage}</h3>
        <span>${CS.fmtDate(w.date,{weekday:"short",month:"short",day:"numeric"})}${w.venue?" · "+w.venue:""}</span></div>
      <div class="score-strip">${w.games.map(g=>CS.gameCard(g)).join("")}</div>
    </div>`).join("") || "<p class='note'>No games recorded for this season yet.</p>";
}
CS.seasonPicker(document.getElementById("tabs"), show, d=>d.games.length);
</script></body></html>
