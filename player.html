<!DOCTYPE html><html lang="en"><head><title>Player | CopticSports</title><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1a28">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CopticSports">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="assets/img/icon-512.png">
<link rel="icon" href="assets/img/logo-mini.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;700;800&family=Archivo+Black&display=swap" rel="stylesheet">
<meta name="description" content="Player profile: stats from every TCBL season.">
<meta property="og:type" content="website"><meta property="og:site_name" content="TCBL">
<meta property="og:title" content="TCBL Player Profile"><meta property="og:description" content="Player profile: stats from every TCBL season.">
<meta property="og:url" content="https://coptichoops.com/player"><meta property="og:image" content="https://coptichoops.com/assets/img/og.jpg">
<meta property="og:image:width" content="1200"><meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image"><meta name="twitter:image" content="https://coptichoops.com/assets/img/og.jpg">
<link rel="stylesheet" href="assets/css/style.css?v=20261115d"></head><body>
<header id="topbar" class="topbar"></header>
<section class="section"><div class="wrap">
  <a class="back" href="players">All players</a>
  <div id="content"><div class="skel" style="height:260px;margin-bottom:24px"></div><div class="skel" style="height:44px;width:360px;margin-bottom:16px"></div><div class="skel" style="height:110px"></div></div>
</div></section>
<script src="assets/js/app.js?v=20261115d"></script>
<script>
CS.nav("players"); CS.footer();
const f1 = v => v==null ? "-" : v.toFixed(1);
const pct = (m,a) => a ? (m/a*100).toFixed(1) : "-";
(async()=>{
  const P = await CS.players(), meta = await CS.data("seasons");
  const slug = new URLSearchParams(location.search).get("p") || "";
  const p = P[slug];
  const el = document.getElementById("content");
  if(!p){
    el.innerHTML = `<div class="card"><h3>Player not found</h3><p class="cardp">We couldn't find that player.
      Try the <a class="plink" href="players" style="color:var(--orange)">player directory</a>.</p></div>`;
    return;
  }
  document.title = `${p.name} | CopticSports`;
  const c = CS.colors[p.team] || {bg:"#1b405e",fg:"#ffffff"};
  const light = ["#ffffff","#ccba92","#67aade"].includes(c.bg.toLowerCase());
  const lm = c.fg.toLowerCase()==="#141414" ? "logo-black.png" : "logo-white.png";
  const t = p.tot, cur = (meta.find(s=>s.current)||{}).id;
  const stats = Object.values(p.seasons).filter(s=>!s.rosterOnly && s.gp).sort((a,b)=>b.season-a.season);
  // at most two badges: captain and titles
  const chips = [];
  if(p.cap5 || p.captain.includes(cur)) chips.push(CS.badge("cap", `Season ${cur} captain`));
  if(p.titles.length) chips.push(CS.badge("champ", p.titles.length>1 ? `${p.titles.length}× champion` : `Season ${p.titles[0]} champion`));
  if(!stats.length && !p.cap5) chips.push(CS.badge("new", "New this season"));

  // one season at a time: pick a season (or career) and the panel swaps
  const tile = (v,l)=>`<div class="st-tile"><b>${v}</b><span>${l}</span></div>`;
  const panel = key=>{
    if(key==="career") return `<div class="st-meta">All seasons combined</div>
      <div class="st-row">${tile(t.gp,"Games")}${tile(f1(t.ppg),"Points / game")}${tile(f1(t.rpg),"Rebounds / game")}${tile(f1(t.apg),"Assists / game")}</div>`;
    const s = stats.find(x=>String(x.season)===key);
    const L = p.lines.filter(l=>l.season===s.season && l.gp);
    return `<div class="st-meta">${CS.team(s.team,"sm")}<span>${s.num!=null?`#${s.num} · `:""}Season ${s.season}</span>${p.titles.includes(s.season)?CS.badge("champ","Champions"):""}</div>
      <div class="st-row">${tile(s.gp,"Games")}${tile(f1(s.ppg),"Points / game")}${tile(f1(s.rpg),"Rebounds / game")}${tile(f1(s.apg),"Assists / game")}</div>
      ${L.length?`<details class="card glog glog-toggle"><summary><h3 style="margin:0">Game log</h3></summary><div class="tbl-scroll"><table class="tbl"><thead><tr><th>Date</th><th>Opponent</th>
        <th class="num">PTS</th><th class="num">REB</th><th class="num">AST</th></tr></thead><tbody>
        ${L.map(l=>`<tr><td>${CS.fmtDate(l.date,{month:"short",day:"numeric"})}</td><td>${CS.teamShort(l.opp,"sm")}</td>
          <td class="num hot">${l.pts}</td><td class="num">${l.reb}</td><td class="num">${l.ast}</td></tr>`).join("")}</tbody></table></div></details>`:""}`;
  };

  // career highs
  const games = p.lines.filter(l=>l.gp);
  const high = (k,l) => { const g = [...games].sort((a,b)=>(b[k]||0)-(a[k]||0))[0];
    return g && g[k] ? `<div class="h"><i>${l}</i><b>${g[k]}</b><span>vs ${g.opp||"-"}, Season ${g.season}</span></div>` : ""; };
  const highs = games.length ? [["pts","Points"],["reb","Rebounds"],["ast","Assists"],["fg3m","Threes"]].map(([k,l])=>high(k,l)).join("") : "";

  el.innerHTML = `
    <div class="p-hero">
      <button class="p-share" type="button" id="share">Share</button>
      ${CS.avatar(p,"xl")}
      <div><h1>${p.name}</h1>
        <div class="p-meta">${p.team?CS.team(p.team,"sm"):""}${p.num!=null?`<span>#${p.num}</span>`:""}${chips.join("")}</div>
        ${t.gp?`<div class="tstats"><div><b>${t.ppg.toFixed(1)}</b><span>PPG</span></div>
          <div><b>${t.rpg.toFixed(1)}</b><span>RPG</span></div>
          <div><b>${t.apg.toFixed(1)}</b><span>APG</span></div></div>`:""}</div>
    </div>
    ${stats.length ? `<div class="sec-head"><h2>Stats</h2></div>
      <div class="seg" id="seg">${stats.map((s,i)=>`<button type="button" data-k="${s.season}" class="${i?"":"on"}">Season ${s.season}</button>`).join("")}
        ${stats.length>1?`<button type="button" data-k="career">Career</button>`:""}</div>
      <div id="panel">${panel(String(stats[0].season))}</div>`
    : `<div class="card"><h3>Welcome to the TCBL</h3>
        <p class="cardp">${p.name.split(" ")[0]}'s stats show up here once Season ${cur} tips off.</p></div>`}
    ${highs?`<div class="sec-head"><h2>Career highs</h2></div><div class="highs">${highs}</div>`:""}`;
  const seg = document.getElementById("seg");
  if(seg) seg.onclick = e=>{ const b = e.target.closest("button"); if(!b || b.classList.contains("on")) return;
    seg.querySelectorAll("button").forEach(x=>x.classList.toggle("on", x===b));
    const pn = document.getElementById("panel"); pn.innerHTML = panel(b.dataset.k);
    pn.classList.remove("swap"); void pn.offsetWidth; pn.classList.add("swap"); };
  const share = document.getElementById("share");
  share.onclick = async ()=>{
    if(navigator.share){ try{ await navigator.share({title:`${p.name} | TCBL`, url:location.href}); }catch(e){} return; }
    try{
      await navigator.clipboard.writeText(location.href);
      share.textContent = "Link copied ✓"; share.classList.add("done");
      clearTimeout(share._t); share._t = setTimeout(()=>{ share.textContent = "Share"; share.classList.remove("done"); }, 2000);
    }catch(e){ CS.toast("Couldn't copy the link. Copy it from the address bar instead."); }
  };
})();
</script></body></html>
