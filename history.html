<link rel="stylesheet" href="assets/css/style.css?v=20261115d"></head><body>
<header id="topbar" class="topbar"></header>

<section class="page-head"><div class="wrap"><h1>History</h1><p>Four seasons, four champions. Nobody has ever repeated.</p></div></section>

<section class="section first"><div class="wrap">
  <div class="sec-head"><h2>Champions</h2></div>
  <div class="features" id="tl"><div class="skel" style="height:250px"></div><div class="skel" style="height:250px"></div></div>
</div></section>

<section class="section"><div class="wrap">
  <div class="sec-head reveal"><h2>Single-game records</h2></div>
  <div class="rec-grid" id="records"></div>
</div></section>

<section class="section"><div class="wrap">
  <div class="sec-head reveal"><h2>All-time leaders</h2><a class="more" href="stats">Stats</a></div>
  <div class="grid3" id="career"></div>
</div></section>



<script src="assets/js/app.js?v=20261115d"></script>
<script>
CS.nav("history"); CS.footer();
(async()=>{
  const all = await CS.allTime(), meta = await CS.data("seasons");
  // ---- season timeline, newest first, with the season to come on top ----
  const cards = [];
  // Two champions wore different colours the year they won: St. Andrew were in
  // white in Season 1 and St. Maximus in lime green in Season 2. The champion
  // cards show the title-year colours; everywhere else uses today's colours.
  const ERA = {"1|St. Andrew":{bg:"#ffffff",fg:"#141414"}, "2|St. Maximus":{bg:"#b2d034",fg:"#141414"}};
  const pill = (team, n, size) => {
    const c = ERA[n+"|"+team]; if(!c) return CS.team(team, size);
    return `<span class="tpill${size?" "+size:""} light" style="background:${c.bg};color:${c.fg}">${team}</span>`;
  };
  [...all.done].reverse().forEach(n=>{
    const d = all.seasons[all.done.indexOf(n)], h = CS.history[n] || {}, fg = CS.finalGame(d);
    const sc = fg ? (fg.team1===d.champion ? [fg.score1,fg.score2] : [fg.score2,fg.score1]) : null;
    cards.push(`<article class="feature">
      <img src="assets/img/photos/champs-s${n}.jpg" alt="${d.champion}, Season ${n} champions" loading="lazy">
      <div class="feature-b"><span class="eyebrow">Season ${n} · ${h.year||""}</span>
        <h3>${d.champion}</h3>
        <p>${h.blurb||""}</p>
        ${sc && d.runnerUp ? `<div class="final"><div>${pill(d.champion,n,"sm")}<b>${sc[0]}</b></div><div>${CS.team(d.runnerUp,"sm")}<b>${sc[1]}</b></div></div>` : ""}</div></article>`);
  });
  document.getElementById("tl").innerHTML = cards.join("");
  // ---- single-game records ----
  const top = k => [...all.highs].sort((a,b)=>(b[k]||0)-(a[k]||0))[0];
  const rec = [["pts","Points"],["reb","Rebounds"],["ast","Assists"],["fg3m","Threes"]].map(([k,l])=>{
    const r = top(k); if(!r) return "";
    return `<div class="rec"><span class="eyebrow">${l}</span><b>${r[k]}</b>
      <div class="who">${CS.pLink(r.name)}</div><span>vs ${r.opp||"-"}, Season ${r.season}</span></div>`;
  });
  document.getElementById("records").innerHTML = rec.join("");
  // ---- career leaders ----
  const cats = [["pts","Career points","PTS"],["reb","Career rebounds","REB"],["ast","Career assists","AST"]];
  document.getElementById("career").innerHTML = cats.map(([k,label,u])=>{
    const t = [...all.players].sort((a,b)=>b[k]-a[k]).slice(0,5);
    return `<div class="card reveal"><h3>${label}</h3>`+t.map((p,i)=>
      `<div class="leader"><span class="n">${i+1}</span><div class="who"><b>${CS.pLink(p.name)}</b>
        <span>${p.seasons.length} season${p.seasons.length>1?"s":""}, ${p.gp} games</span></div>
        <div class="val"><b>${p[k]}</b><span>${u}</span></div></div>`).join("")+"</div>";
  }).join("");

})();
</script>
</body></html>
