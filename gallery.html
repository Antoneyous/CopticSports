<!DOCTYPE html><html lang="en"><head><title>Gallery | TCBL</title>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1a28">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="assets/img/icon-512.png">

<meta property="og:title" content="TCBL Gallery"><meta property="og:description" content="Media Days, Draft Night, game days and champions from the Tampa Bay Coptic Basketball League.">
<meta property="og:url" content="https://coptichoops.com/gallery"><meta property="og:image" content="https://coptichoops.com/assets/img/og.jpg">

<link rel="stylesheet" href="assets/css/style.css?v=20261115e"></head><body>
<header id="topbar" class="topbar"></header>

<section class="page-head"><div class="wrap"><h1>Gallery</h1><p>Media Days, Draft Night, game days and champions, from the first season to now.</p></div></section>

<section class="section first"><div class="wrap">
  <div class="gfilters" id="cats" role="toolbar" aria-label="Filter by moment"></div>
  <div class="gfilters seasons" id="seas" role="toolbar" aria-label="Filter by season"></div>
  <div class="gcount" id="gcount"></div>
  <div class="masonry" id="grid"><div class="skel" style="height:220px;margin-bottom:12px"></div><div class="skel" style="height:300px;margin-bottom:12px"></div><div class="skel" style="height:180px;margin-bottom:12px"></div><div class="skel" style="height:260px;margin-bottom:12px"></div><div class="skel" style="height:240px;margin-bottom:12px"></div><div class="skel" style="height:200px;margin-bottom:12px"></div><div class="skel" style="height:320px;margin-bottom:12px"></div><div class="skel" style="height:210px;margin-bottom:12px"></div></div>
  <div style="text-align:center;margin:26px 0 8px"><button class="btn ghost" id="more" hidden>Show more photos</button></div>
  <p style="margin-top:26px;text-align:center"><a class="btn ghost" href="https://www.instagram.com/coptichoops/" target="_blank" rel="noopener">More on Instagram @coptichoops</a></p>
</div></section>

<div class="lightbox" id="lb" role="dialog" aria-modal="true" aria-label="Photo viewer">
  <button type="button" class="x" aria-label="Close">✕</button><button type="button" class="pv" aria-label="Previous photo">‹</button><button type="button" class="nx" aria-label="Next photo">›</button>
  <img alt=""><div class="cap" aria-live="polite"></div></div>

<script src="assets/js/app.js?v=20261115e"></script>
<script>
CS.nav("gallery"); CS.footer();
(async()=>{
  const all = (await CS.data("gallery")).map((p,i)=>({...p,_i:i})).sort((a,b)=>(b.season-a.season)||(a._i-b._i));
  const CATS = [["all","All"],["gameday","Game Day"],["mediaday","Media Day"],["draftnight","Draft Night"],["champions","Champions"],["brotherhood","Fellowship"],["faith","Faith"]];
  const key = c => c.toLowerCase().replace(/\s/g,"");
  let cat = (location.hash||"#all").slice(1), season = 0, shown = [];
  if(!CATS.some(([k])=>k===cat)) cat = "all";
  const seasons = [...new Set(all.map(p=>p.season))].sort();
  const bar = (el, items, cur, on) => {
    el.innerHTML = items.map(([k,l])=>`<button data-k="${k}" class="${k==cur?"on":""}">${l}</button>`).join("");
    el.querySelectorAll("button").forEach(b=>b.onclick=()=>{ on(b.dataset.k); });
  };
  const draw = () => {
    bar(document.getElementById("cats"), CATS, cat, k=>{ cat=k; history.replaceState(null,"","#"+k); draw(); });
    bar(document.getElementById("seas"), [[0,"All seasons"],...seasons.map(s=>[s,"Season "+s])], season, k=>{ season=+k; draw(); });
    shown = all.filter(p=>(cat==="all"||key(p.cat)===cat) && (!season||p.season===season));
    // brotherhood includes the faith moments so the filter never feels thin
    if(cat==="brotherhood") shown = all.filter(p=>["brotherhood","faith"].includes(key(p.cat)) && (!season||p.season===season));
    document.getElementById("gcount").textContent = `${shown.length} photo${shown.length===1?"":"s"}`;
    limit = 60; paint();
  };
  let limit = 60;
  const more = document.getElementById("more");
  const esc = s => String(s??"").replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;");
  const grid = document.getElementById("grid");
  const paint = () => {
    // each photo is a real button, so it opens from the keyboard as well as by tap
    grid.innerHTML = shown.slice(0,limit).map((p,i)=>
      `<figure class="reveal in"><button type="button" class="ph" data-i="${i}" aria-label="Open photo: ${esc(p.caption)}"><img src="${CS.photo(p.id,1)}" width="${p.w}" height="${p.h}" alt="" loading="lazy"></button><figcaption aria-hidden="true">${esc(p.caption)}</figcaption></figure>`).join("");
    more.hidden = shown.length <= limit;
    more.textContent = `Show more photos (${shown.length-limit} more)`;
  };
  grid.onclick = e => { const b = e.target.closest(".ph"); if(b) open(+b.dataset.i); };
  more.onclick = () => { limit += 60; paint(); };
  // ---- lightbox: arrows, keyboard, and swipes that follow the finger ----
  const lb = document.getElementById("lb"), img = lb.querySelector("img"), cap = lb.querySelector(".cap");
  let at = 0, opener = null;
  const preload = i => { const p = shown[(i+shown.length)%shown.length]; if(p) (new Image()).src = CS.photo(p.id); };
  // from: +1 slides the new photo in from the right, -1 from the left, 0 just shows it
  const show = (i, from) => {
    at = (i+shown.length)%shown.length; const p = shown[at];
    img.src = CS.photo(p.id); img.alt = p.caption;
    cap.innerHTML = `${esc(p.caption)}<span class="cnt">${at+1} / ${shown.length}</span>`;
    img.style.transition = "none";
    img.style.transform = from ? `translateX(${from*48}px)` : ""; img.style.opacity = from ? "0" : "";
    void img.offsetWidth;
    img.style.transition = img.style.transform = img.style.opacity = "";
    preload(at+1); preload(at-1);
  };
  const open = i => {
    opener = document.activeElement;
    show(i, 0); lb.classList.add("open"); document.body.style.overflow = "hidden";
    lb.querySelector(".x").focus({preventScroll:true});
  };
  const close = () => {
    lb.classList.remove("open"); document.body.style.overflow = "";
    img.style.transform = img.style.opacity = ""; lb.style.background = "";
    if(opener && opener.focus) opener.focus({preventScroll:true});
  };
  lb.querySelector(".x").onclick = close;
  lb.querySelector(".pv").onclick = ()=>show(at-1, -1);
  lb.querySelector(".nx").onclick = ()=>show(at+1, 1);
  lb.onclick = e => { if(e.target===lb) close(); };
  document.addEventListener("keydown", e=>{ if(!lb.classList.contains("open")) return;
    if(e.key==="Escape") close();
    if(e.key==="ArrowLeft") show(at-1, -1);
    if(e.key==="ArrowRight") show(at+1, 1);
    if(e.key==="Tab"){   // keep focus on the viewer's own controls while it's open
      const f = [...lb.querySelectorAll("button")], k = f.indexOf(document.activeElement);
      if(e.shiftKey && k<=0){ e.preventDefault(); f[f.length-1].focus(); }
      else if(!e.shiftKey && k===f.length-1){ e.preventDefault(); f[0].focus(); }
    }
  });
  // Sideways: the photo tracks the finger, then slides off to the next one.
  // Down: the photo and backdrop follow, and a long enough pull closes the viewer.
  let x0 = null, y0 = 0, dx = 0, dy = 0, axis = null;
  lb.addEventListener("touchstart", e=>{
    if(e.touches.length>1){ x0 = null; return; }
    x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; dx = dy = 0; axis = null;
  }, {passive:true});
  lb.addEventListener("touchmove", e=>{
    if(x0===null) return;
    if(e.touches.length>1){ x0 = null; img.style.transition = img.style.transform = img.style.opacity = ""; return; }
    dx = e.touches[0].clientX - x0; dy = e.touches[0].clientY - y0;
    if(!axis && Math.hypot(dx,dy) > 8){ axis = Math.abs(dx) > Math.abs(dy) ? "x" : "y"; img.style.transition = "none"; }
    if(axis==="x"){ img.style.transform = `translateX(${dx}px)`; img.style.opacity = String(1 - Math.min(.5, Math.abs(dx)/700)); }
    if(axis==="y" && dy>0){ img.style.transform = `translateY(${dy}px) scale(${1 - Math.min(.15, dy/2000)})`;
      lb.style.background = `rgba(5,12,20,${(.95*(1 - Math.min(.7, dy/450))).toFixed(3)})`; }
  }, {passive:true});
  lb.addEventListener("touchend", ()=>{
    if(x0===null) return;
    x0 = null; img.style.transition = "";
    if(axis==="x" && Math.abs(dx) > 60){
      const d = dx<0 ? 1 : -1;
      img.style.transform = `translateX(${-d*60}vw)`; img.style.opacity = "0";
      setTimeout(()=>show(at+d, d), 150);
    } else if(axis==="y" && dy > 110){ close(); }
    else { img.style.transform = img.style.opacity = ""; lb.style.background = ""; }
  });
  draw();
})();
</script>
</body></html>
