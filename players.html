<meta property="og:title" content="TCBL Players"><meta property="og:description" content="Every TCBL player, with photos and career stats from every season.">

<link rel="stylesheet" href="assets/css/style.css?v=20261115d"></head><body>
<header id="topbar" class="topbar"></header>
<section class="page-head"><div class="wrap"><h1>Players</h1></div></section>
<section class="section first"><div class="wrap">
  <div class="tabs" id="ptabs">
    <span class="tabwrap"><button data-f="s5" class="on">Season 5</button></span>
    <span class="tabwrap"><button data-f="all">All-time</button></span></div>
  <div class="p-tools"><input class="p-search" id="q" type="search" placeholder="Search by name" autocomplete="off" aria-label="Search players">
    <span class="p-count" id="count"></span></div>
  <div class="people list" id="grid"><div class="skel" style="height:56px"></div><div class="skel" style="height:56px"></div><div class="skel" style="height:56px"></div><div class="skel" style="height:56px"></div><div class="skel" style="height:56px"></div><div class="skel" style="height:56px"></div><div class="skel" style="height:56px"></div><div class="skel" style="height:56px"></div><div class="skel" style="height:56px"></div><div class="skel" style="height:56px"></div></div>
</div></section>
<script src="assets/js/app.js?v=20261115d"></script>
<script>
CS.nav("players"); CS.footer();
(async()=>{
  const P = Object.values(await CS.players());
  const last = n => n.replace(/\(.*?\)/g,"").trim().split(/\s+/).pop();
  let filter = "s5";
  const q = document.getElementById("q");
  const render = ()=>{
    const s = q.value.trim().toLowerCase();
    let list = P.filter(p=> (filter==="all" ? p.seasonList.length : p.s5) && (!s || p.name.toLowerCase().includes(s)));
    // captains first, then everyone A to Z by last name
    list.sort((a,b)=> (b.cap5-a.cap5) || last(a.name).localeCompare(last(b.name)) || a.name.localeCompare(b.name));
    document.getElementById("count").textContent = `${list.length} player${list.length===1?"":"s"}`;
    document.getElementById("grid").innerHTML = list.map(p=>{
      const team = filter==="s5" ? (p.seasons[5] ? p.seasons[5].team : null) : p.team;
      const tag = p.cap5 ? CS.badge("cap") : p.seasonList.length ? "" : CS.badge("new");
      return `<a class="person" href="player?p=${p.slug}">${CS.avatar(p)}
        <span class="person-t"><b>${p.name}</b>${team?`<span class="person-m">${CS.teamShort(team,"sm")}</span>`:""}</span>${tag}</a>`;
    }).join("") || `<p class="note">No players match “${q.value}”.</p>`;
  };
  document.querySelectorAll("#ptabs button").forEach(b=>b.onclick=()=>{
    document.querySelectorAll("#ptabs button").forEach(x=>x.classList.remove("on")); b.classList.add("on");
    filter = b.dataset.f; render(); });
  q.oninput = render;
  render();
})();
</script></body></html>
